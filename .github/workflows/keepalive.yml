name: keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Probe runs do not count as activity; commits do. This
# job commits a heartbeat monthly so the probe schedule can never be silently
# disabled — a monitor that stops running is worse than no monitor.

on:
  schedule:
    - cron: '23 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit heartbeat
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name 'keepalive'
          git config user.email 'keepalive@users.noreply.github.com'
          git add .heartbeat
          git commit -m 'keepalive heartbeat'
          git push
